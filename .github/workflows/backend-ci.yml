name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

env:
  # Test-only value — JwtStrategy/JwtModule need it at module-init time even
  # though these jobs never touch a real database. Never the real secret,
  # which only ever lives as a SAM NoEcho parameter (F6.2).
  JWT_ACCESS_SECRET: ci-test-only-secret-do-not-use-in-prod

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test -- --coverage
      - run: npm run test:e2e
      - run: npm run build
